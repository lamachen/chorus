<head>

<title>CHORUS · Diagnose</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0d12;color:#e8ecf4;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:14px 14px 40px}
  h1{font-size:18px;margin:6px 0 2px}
  p.hin{color:#93a9c9;font-size:12.5px;margin:0 0 14px}
  button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;margin:4px 6px 4px 0}
  button.sec{background:#1f2937;border:1px solid #334155}
  pre{background:#05070b;border:1px solid #1e293b;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px}
  .ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#f87171}.dim{color:#64748b}

<body>
<h1>Diagnose · FastVLM-0.5B-ONNX auf DIESEM Gerät</h1>
<p class="hin">Kein Anruf, keine Stimme, keine Kamera-Automatik. Jeder Schritt schreibt seinen Rohwert hier rein. Am Ende: „Bericht kopieren" und mir senden.</p>
<button id="run">Messreihe starten</button>
<button id="copy" class="sec">Bericht kopieren</button>
<button id="cam" class="sec">zusätzlich: echter Kamera-Frame</button>
<pre id="log">Bereit.\n</pre>
